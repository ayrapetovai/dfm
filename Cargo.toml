[package]
description = "dot-file manager"
authors = ["ayrapetovai"]
name = "dfm"
version = "0.2.0"
edition = "2024"
readme = "README.md"
license = "Unlicense"
documentation = "https://github.com/ayrapetovai/dfm/blob/main/README.md"
homepage = "https://github.com/ayrapetovai/dfm.git"
repository = "https://github.com/ayrapetovai/dfm.git"

[dependencies]
microxdg = "0.2.0"
clap = { version = "4.6.4", features = ["cargo", "derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_regex = "1.2.0"
toml = "1.1.3"
envmnt = "0.10.4"
filetime_creation = "0.2.0"
walkdir = "2.5.0"
regex = "1.13.1"
symlink = "0.1.0"
log = "0.4.33"
stderrlog = "0.6.0"
rpassword = "7.5.4"
thiserror = "2"
colored = "3"
sha2 = "0.10"
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.9"

[dev-dependencies]
clap_mangen = "0.3.0"

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.chacha20poly1305]
opt-level = 3

[profile.dev.package.chacha20]
opt-level = 3

[profile.dev.package.poly1305]
opt-level = 3

[profile.dev.package.cpufeatures]
opt-level = 3

[profile.release]
panic = "abort"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true

[package.metadata.aur]
files = [["dfm.1", "/usr/share/man/man1/dfm.1"]]

